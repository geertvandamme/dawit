name: Build draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release version
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(DawIt VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES.*/\1/p' CMakeLists.txt)
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag must match the CMake project version (v$version)." >&2
            exit 1
          fi
          echo "DAWIT_VERSION=$version" >> "$GITHUB_ENV"
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 -DDAWIT_BUILD_TESTS=ON
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DDAWIT_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Run tests on macOS
        if: runner.os == 'macOS'
        run: ./build/DawItTests_artefacts/Release/DawItTests
      - name: Run tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./build/DawItTests_artefacts/Release/DawItTests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package macOS candidate
        if: runner.os == 'macOS'
        run: bash tools/package-release-macos.sh "$DAWIT_VERSION"
      - name: Package Windows candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-release-windows.ps1 -Version $env:DAWIT_VERSION
      - name: Upload candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download candidates
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          mac=(DawIt-*-macos-arm64.dmg)
          windows=(DawIt-*-windows-x64.zip)
          if [[ ${#mac[@]} -ne 1 || ${#windows[@]} -ne 1 ]]; then
            echo 'Expected one package per platform.' >&2
            exit 1
          fi
          packages=("${mac[@]}" "${windows[@]}")
          sha256sum "${packages[@]}" > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          Draft candidates for testing only. Do not publish until the checks in
          DISTRIBUTION_TODO.md are complete, including complete corresponding source,
          third-party notices, runtime dependencies and clean-machine testing.

          macOS: Apple Silicon, ad-hoc signed, not notarised. Windows: x64 portable
          ZIP, unsigned; this is not an installer. System security controls may block
          these builds. Demucs and Whisper models are downloaded separately.
          EOF
          gh release create "$TAG" "${packages[@]}" SHA256SUMS.txt --draft --verify-tag --title "DawIt $TAG" --notes-file release-notes.md
