name: Compare MSVC enum diagnostics
on:
  push:
    branches: ['codex/onnx-release-integration-validation']
permissions:
  contents: read
jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Compile representative Protobuf enum expression
        shell: pwsh
        run: |
          $code = @'
          typedef enum { kUpb_FieldMode_Scalar = 0 } upb_FieldMode;
          typedef enum { kUpb_LabelFlags_IsAlternate = 1 } upb_LabelFlags;
          int main(void) { return (int)kUpb_FieldMode_Scalar | (int)kUpb_LabelFlags_IsAlternate; }
          '@
          Set-Content -Path enum-warning.c -Value $code
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No MSVC toolchain found' }
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=x64 >nul && cl /nologo /W4 /c enum-warning.c"
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
